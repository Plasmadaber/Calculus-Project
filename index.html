<!DOCTYPE html>
<html>
<head>
  <title>Riemann Sum Visualizer</title>
  <link rel="stylesheet" href="public/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js" ></script>
</head>
<body>
  <div id="container">
    <h1 id="title">Riemann Sum Visualizer</h1>
    <canvas id="graphCanvas"></canvas>
      <div id="controls">
        <button id="clearBtn">Clear</button>
        <button id="calcBtn">Calculate Area</button>

        <label for="rectSlider">Rectangles:</label>
        <input type="range" id="rectSlider" min="5" max="100" value="5">
        <span id="rectCount">5</span>
        <p id="areaResult"></p>
      </div>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
